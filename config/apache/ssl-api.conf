<VirtualHost *:443>
    DocumentRoot /data/sites/api/public
    <Directory /data/sites/api/public/>
        DirectoryIndex index.php
        Options +ExecCGI
        AllowOverride All
        Require all granted
        Order Allow,Deny
        Allow from All
    </Directory>

    ErrorLog /data/logs/httpd-api-aes-ssl_error.log
    CustomLog /data/logs/httpd-api-aes-ssl_access.log combined

    SSLEngine on

    #   A self-signed (snakeoil) certificate can be created by installing
    #   the ssl-cert package. See
    #   /usr/share/doc/apache2/README.Debian.gz for more info.
    #   If both key and certificate are stored in the same file, only the
    #   SSLCertificateFile directive is needed.
    SSLCertificateFile    /etc/ssl/certs/upload-bundle-local.demat.lan.pem
    SSLCertificateKeyFile /etc/ssl/private/upload-bundle-local.demat.lan.key
</VirtualHost>