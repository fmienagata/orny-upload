---
version: '3.8'

services:
  api:
    privileged: true
    build:
      context: .
      dockerfile: ./Dockerfile
      network: host
    image: docaposte/ubuntu20-apache2-php8:1.0.0
    environment:
      - TZ=Europe/Paris
      - APACHE_LOG_DIR=/data/logs
    ports:
      - '8900:80'
      - '8990:443'
    container_name: UPLOAD-BUNDLE
    hostname: upload-bundle-local.demat.lan
    restart: unless-stopped
    expose:
      - 80
      - 443
    volumes:
      - uploaddata:/data:rw
      - nfs-upload:/mnt/nfs-upload:rw
      - ./:/data/sites/api:rw
      - ./config/apache/api.conf:/etc/apache2/sites-available/api.conf
      - ./config/apache/apache2.conf:/etc/apache2/apache2.conf
      - ./config/apache/php.ini:/etc/php.ini
      -  /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/app:cached
    tty: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    extra_hosts:
      - "upload-bundle-local.demat.lan:127.0.0.1"
      - "api-aes-local.demat.lan:172.22.0.23"
      - "mongodb-local.demat.lan:172.22.0.1"
      - "upload-bundle-local.demat.lan:172.22.0.20"
    networks:
      nginx-proxy:
        ipv4_address: 172.22.0.20
    entrypoint:
      - /lib/systemd/systemd
  esc410:
    privileged: true
    image: docaposte/ubuntu20-esc:4.1.0
    build:
      context: .
      dockerfile: ./esc.Dockerfile
      args:
        ESC_NAME: ESCNODE_410
        ESC_VERSION: 4.1.0
        ESC_MYSQL_USER: escClient
        ESC_MYSQL_PASSWORD: escClient1234
    container_name: ESCNODE-410
    environment:
      ESC_NAME: ESCNODE_410
      ESC_VERSION: 4.1.0
      MYSQL_HOST: localhost
      MYSQL_PORT: 3306
      MARIADB_ROOT_USER: escClient
      MARIADB_ROOT_PASSWORD: escClient1234
      ESC_MYSQL_USER: escClient
      ESC_MYSQL_PASSWORD: escClient1234
      SSL_CERTIFICAT_SYSTEM_PEM: /home/escnode/generationsCertificats/finalSystem/sslSysteme.pem
      CERTIFICATE_SYSTEM: /home/escnode/generationsCertificats/finalSystem/sslSysteme.pem
      JAVA_HOME: /usr/lib/jvm/java-1.8.0-openjdk-amd64
      ESC_LOG_DIR: /data/logs/esc
    ports:
      - 4100:4100
      - 4110:4110
      - 12000:80
      - 12443:443
      - 3309:3306
    restart: unless-stopped
    expose:
      - 80
      - 443
      - 3306
      - 4100
      - 4110
      - 10443
    hostname: safe-box-esc-local.demat.lan
    volumes:
      - escnodedata:/home:rw
      - ./config/apache/apache2.conf:/etc/apache2/apache2.conf
      - ./config/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ./config/apache/php.ini:/etc/php.ini
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/app:cached
    tty: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    extra_hosts:
      - "safe-box-esc-local.demat.lan:127.0.0.1"
      - "safe-box-esc-local.demat.lan:172.22.0.21"
    networks:
      nginx-proxy:
        ipv4_address: 172.22.0.21
    user: root:root
    working_dir: /home/escnode
    entrypoint:
      - /lib/systemd/systemd

volumes:
  uploaddata:
    driver: local
  escnodedata:
    driver: local
  databasedata:
    driver: local
  nfs-upload:
    driver: local
  #  driver_opts:
  #    type: "nfs"
  #    o: "addr=127.0.0.1,nolock,soft,rw"
  #    device: ":/data/upload"
networks:
  nginx-proxy:
    name: nginx-proxy
