---
version: '3.8'

services:
  api:
    privileged: true
    build:
      context: .
      dockerfile: ./Dockerfile
      network: host
    image: docaposte/ubuntu20-apache2-php8:1.0.0
    environment:
      - TZ=Europe/Paris
      - APACHE_LOG_DIR=/data/logs
    ports:
      - '8900:80'
      - '8990:443'
    container_name: UPLOAD-BUNDLE
    hostname: upload-bundle-local.demat.lan
    restart: unless-stopped
    expose:
      - 80
      - 443
    volumes:
      - uploaddata:/data:rw
      #- nfs-upload:/mnt/nfs-upload
      - ./:/data/sites/api:rw
      #- ./config/apache/api.conf:/etc/apache2/sites-available/api.conf
      #- ./config/apache/apache2.conf:/etc/apache2/apache2.conf
      - ./config/apache/php.ini:/etc/php.ini
      -  /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/app:cached
    tty: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    networks:
      nginx-proxy:
        ipv4_address: 172.22.0.20
    #command: ["sh", "-c", "
    #    /usr/sbin/init;
    #    /usr/bin/redis-server /etc/redis/redis.conf --daemonize yes;
    #    /usr/bin/supervisord -c /etc/supervisor/supervisord.conf;
    #    /usr/sbin/usermod -s /bin/bash www-data;
    #    /usr/bin/chown -R www-data:www-data /data/sites;
    #    /usr/bin/chmod -R 777 /data/sites/api/var;
    #    /usr/bin/chmod -R 777 /data/logs;
    #    export APACHE_LOG_DIR=/data/logs;
    #    /usr/sbin/a2enmod rewrite;
    #    /usr/sbin/a2ensite api;
    #    /usr/sbin/a2dissite 000-default;
    #    /usr/sbin/service apache2 reload;
    #    /usr/bin/mongod -f /etc/mongod.conf --bind_ip 127.0.0.1 --fork;
    #    /etc/init.d/clamav-daemon restart;
    #    /usr/sbin/service apache2 restart;
    #    /bin/bash;
    #  "
    #]
  esc410:
    privileged: true
    image: docaposte/ubuntu20-esc:4.1.0
    build:
      context: .
      dockerfile: ./esc.Dockerfile
      args:
        ESC_NAME: ESCNODE_410
        ESC_VERSION: 4.1.0
        ESC_MYSQL_USER: escClient
        ESC_MYSQL_PASSWORD: escClient1234
    container_name: ESCNODE-410
    environment:
      ESC_NAME: ESCNODE_410
      ESC_VERSION: 4.1.0
      MYSQL_HOST: localhost
      MYSQL_PORT: 3306
      MARIADB_ROOT_USER: escClient
      MARIADB_ROOT_PASSWORD: escClient1234
      ESC_MYSQL_USER: escClient
      ESC_MYSQL_PASSWORD: escClient1234
      SSL_CERTIFICAT_SYSTEM_PEM: /home/escnode/generationsCertificats/finalSystem/sslSysteme.pem
      CERTIFICATE_SYSTEM: /home/escnode/generationsCertificats/finalSystem/sslSysteme.pem
      JAVA_HOME: /usr/lib/jvm/java-1.8.0-openjdk-amd64
      ESC_LOG_DIR: /data/logs/esc
    ports:
      - 4100:4100
      - 4010:4010
      - 12000:80
      - 12443:443
      - 3309:3306
    restart: unless-stopped
    expose:
      - 80
      - 443
      - 3306
      - 10443
    hostname: safe-box-esc-local.demat.lan
    volumes:
      - escnodedata:/home
      - ./config/apache/apache2.conf:/etc/apache2/apache2.conf
      - ./config/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ./config/apache/php.ini:/etc/php.ini
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/app:cached
    tty: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    networks:
      nginx-proxy:
        ipv4_address: 172.22.0.21
    user: root:root
    working_dir: /home/escnode

volumes:
  uploaddata:
    driver: local
  escnodedata:
    driver: local
  databasedata:
    driver: local
  #nfs-upload:
  #  driver: local
  #  driver_opts:
  #    type: "nfs"
  #    o: "addr=127.0.0.1,nolock,soft,rw"
  #    device: ":/data/upload"
networks:
  nginx-proxy:
    name: nginx-proxy
